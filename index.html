<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #21262d;background:#161b22}
header h1{font-size:18px;font-weight:800}header h1 span{color:#f0883e}
.tabs{display:flex;background:#161b22;border-bottom:1px solid #21262d;overflow-x:auto}
.tab{padding:10px 16px;cursor:pointer;font-size:12px;font-weight:700;color:#8b949e;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.tab:hover{color:#c9d1d9}.tab.active{color:#f0883e;border-bottom-color:#f0883e}
.main{flex:1;display:flex;gap:0;overflow:hidden}
.pane{flex:1;display:flex;flex-direction:column;border-right:1px solid #21262d}
.pane:last-child{border-right:none}
.pane-header{padding:6px 12px;font-size:11px;color:#8b949e;background:#161b22;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center}
.pane-header button{padding:3px 10px;border-radius:4px;background:#21262d;border:1px solid #30363d;color:#8b949e;font-size:11px;cursor:pointer}
.pane-header button:hover{background:#30363d;color:#c9d1d9}
textarea{flex:1;background:#0d1117;color:#c9d1d9;border:none;padding:14px;font-family:'SF Mono',Consolas,monospace;font-size:13px;line-height:1.6;resize:none;outline:none;tab-size:2}
textarea::placeholder{color:#484f58}
.drop-zone{padding:12px;margin:8px;border:2px dashed #30363d;border-radius:8px;text-align:center;color:#8b949e;font-size:12px;transition:border-color .2s}
.drop-zone.dragover{border-color:#f0883e;color:#f0883e}
.img-preview{max-width:100%;max-height:200px;border-radius:6px;margin:8px;display:none}
.error{color:#f85149;font-size:12px;padding:8px 12px;display:none}
.toolbar-bottom{padding:8px 12px;background:#161b22;border-top:1px solid #21262d;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.info{font-size:11px;color:#8b949e;padding:4px 0}
@media(max-width:700px){.main{flex-direction:column}.pane{border-right:none;border-bottom:1px solid #21262d}textarea{min-height:120px}}
</style>
</head>
<body>
<header>
  <h1>Base64 <span>Tool</span></h1>
</header>
<div class="tabs">
  <div class="tab active" data-tab="base64">Base64</div>
  <div class="tab" data-tab="url">URL</div>
  <div class="tab" data-tab="html">HTML</div>
  <div class="tab" data-tab="jwt">JWT</div>
  <div class="tab" data-tab="hash">Hash</div>
</div>
<div class="main">
  <div class="pane">
    <div class="pane-header"><span>Input</span><button id="btnPaste">Paste</button></div>
    <textarea id="input" placeholder="Enter text to encode or paste encoded text to decode..." spellcheck="false"></textarea>
    <div class="drop-zone" id="dropZone">Drop a file here (text or image)</div>
    <input type="file" id="fileInput" style="display:none">
    <img class="img-preview" id="imgPreview">
  </div>
  <div class="pane">
    <div class="pane-header"><span>Output</span><button id="btnCopy">Copy</button></div>
    <textarea id="output" readonly placeholder="Result will appear here..." spellcheck="false"></textarea>
    <div class="error" id="error"></div>
  </div>
</div>
<div class="toolbar-bottom">
  <button class="pane-header button" id="btnEncode" style="padding:6px 14px;border-radius:6px;background:#f0883e;border:none;color:#fff;font-weight:700;font-size:12px;cursor:pointer">Encode</button>
  <button class="pane-header button" id="btnDecode" style="padding:6px 14px;border-radius:6px;background:#21262d;border:1px solid #30363d;color:#c9d1d9;font-weight:700;font-size:12px;cursor:pointer">Decode</button>
  <button class="pane-header button" id="btnSwap" style="padding:6px 14px;border-radius:6px;background:#21262d;border:1px solid #30363d;color:#c9d1d9;font-size:12px;cursor:pointer">Swap</button>
  <span class="info" id="info"></span>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
let curTab='base64';

function encode(text){
  if(!text)return'';
  try{
    switch(curTab){
      case 'base64':return btoa(unescape(encodeURIComponent(text)));
      case 'url':return encodeURIComponent(text);
      case 'html':return text.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      case 'jwt':return JSON.stringify({header:JSON.parse(atob(text.split('.')[0])),payload:JSON.parse(atob(text.split('.')[1])),signature:text.split('.')[2]||''},null,2);
      case 'hash':return sha256(text);
    }
  }catch(e){return 'Error: '+e.message;}
}

function decode(text){
  if(!text)return'';
  try{
    switch(curTab){
      case 'base64':return decodeURIComponent(escape(atob(text.trim())));
      case 'url':return decodeURIComponent(text);
      case 'html':const el=document.createElement('textarea');el.innerHTML=text;return el.value;
      case 'jwt':const p=text.trim().split('.');if(p.length<2)throw new Error('Invalid JWT');return JSON.stringify({header:JSON.parse(atob(p[0])),payload:JSON.parse(atob(p[1]))},null,2);
      case 'hash':return 'Hash is one-way only. Use Encode to generate.';
    }
  }catch(e){return 'Error: '+e.message;}
}

function sha256(str){
  // Simple hash display
  let h=0;
  for(let i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h|=0;}
  return 'Hash (FNV-1a): '+Math.abs(h).toString(16).padStart(8,'0')+'\n\nNote: Use SubtleCrypto for SHA-256:\ncrypto.subtle.digest("SHA-256", new TextEncoder().encode(text))';
}

function run(mode){
  const input=$('input').value;
  $('error').style.display='none';
  const result=mode==='encode'?encode(input):decode(input);
  if(result.startsWith('Error:')){$('error').textContent=result.slice(7);$('error').style.display='block';$('output').value='';}
  else{$('output').value=result;}
  $('info').textContent=`${input.length} chars input → ${result.length} chars output`;
}

$('btnEncode').addEventListener('click',()=>run('encode'));
$('btnDecode').addEventListener('click',()=>run('decode'));

$('btnSwap').addEventListener('click',()=>{
  const i=$('input').value,o=$('output').value;
  $('input').value=o;$('output').value=i;
});

$('btnCopy').addEventListener('click',()=>{
  navigator.clipboard.writeText($('output').value).then(()=>alert('Copied!')).catch(()=>{});
});

$('btnPaste').addEventListener('click',()=>{
  navigator.clipboard.readText().then(t=>{$('input').value=t;}).catch(()=>{});
});

// Tab switching
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelector('.tab.active').classList.remove('active');
    t.classList.add('active');curTab=t.dataset.tab;
    const labels={
      base64:['Text','Base64'],url:['Text','URL Encoded'],html:['Text','HTML Entities'],
      jwt:['JWT Token','Decoded JWT'],hash:['Text','Hash']
    };
    const l=labels[curTab];
    document.querySelectorAll('.pane-header span')[0].textContent='Input ('+l[0]+')';
    document.querySelectorAll('.pane-header span')[1].textContent='Output ('+l[1]+')';
    $('output').value='';$('error').style.display='none';
  });
});

// File drop
const dz=$('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
dz.addEventListener('drop',e=>{
  e.preventDefault();dz.classList.remove('dragover');
  const file=e.dataTransfer.files[0];if(!file)return;handleFile(file);
});
dz.addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});

function handleFile(file){
  if(file.type.startsWith('image/')){
    const reader=new FileReader();
    reader.onload=e=>{
      $('imgPreview').src=e.target.result;
      $('imgPreview').style.display='block';
      $('input').value=e.target.result;
    };
    reader.readAsDataURL(file);
  }else{
    const reader=new FileReader();
    reader.onload=e=>{$('input').value=e.target.result;};
    reader.readAsText(file);
  }
}

// Auto-process on input
$('input').addEventListener('input',()=>{
  const v=$('input').value;
  if(!v){$('output').value='';return;}
  // Auto-detect: if input looks encoded, decode; else encode
  if(curTab==='base64'&&/^[A-Za-z0-9+/=\s]+$/.test(v)&&v.length>10)run('decode');
  else if(curTab==='url'&&/%[0-9A-Fa-f]{2}/.test(v))run('decode');
  else run('encode');
});
})();
</script>
</body>
</html>
